version: '3'

volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile

    image: cutout_production_django
    volumes:
      - production_django_media:/app/cutout/media
      # Certificados SP para assinatura/criptografia SAML2 (djangosaml2)
      - ./config/certificates:/app/config/certificates:ro
      # Bind-mount DP1 HiPS on the host to CUTOUT_HIPS_LSST_DP1_ROOT (default /data/hips/lsst_dp1).
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: cutout_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: cutout_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      - '0.0.0.0:5555:5555'

  redis:
    image: redis:6

  celeryworker:
    <<: *django
    image: cutout_production_celeryworker
    command: /start-celeryworker

  celeryworker-heavy:
    <<: *django
    image: cutout_production_celeryworker_heavy
    command: /start-celeryworker-heavy
    cpus: ${CUTOUT_WORKER_CPUS:-8.0}
    mem_limit: ${CUTOUT_WORKER_MEMORY:-32g}

  celerybeat:
    <<: *django
    image: cutout_production_celerybeat
    command: /start-celerybeat

  flower:
    <<: *django
    image: cutout_production_flower
    command: /start-flower

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: cutout_local_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
